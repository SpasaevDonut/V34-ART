name: Feature request
description: Suggest an offline moviemaking improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    attributes:
      label: Moviemaking problem
      description: Describe the workflow limitation this feature would solve.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Example commands or output

  - type: checkboxes
    attributes:
      label: Scope confirmation
      options:
        - label: This request is for offline moviemaking, demo playback, or rendering—not competitive gameplay.
          required: true
